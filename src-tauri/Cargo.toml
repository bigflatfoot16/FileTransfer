[package]
name = "swiftcopy"
version = "0.1.0"
edition = "2021"
description = "Fast file transfer app"
authors = ["SwiftCopy"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
rayon = "1.10"
walkdir = "2.5"
reflink-copy = "0.1"
parking_lot = "0.12"
once_cell = "1.19"
sysinfo = "0.32"
dirs = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_Security",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
